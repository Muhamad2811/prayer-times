<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --sky-top: #05080f;
  --gold: #d4a843;
  --gold-light: #f0c96a;
  --gold-dim: rgba(212,168,67,0.12);
  --gold-border: rgba(212,168,67,0.25);
  --text: #e8e0d0;
  --text-dim: #7a7060;
  --text-mid: #b0a898;
  --surface: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #05080f;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
.sky-bg {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 100% 60% at 50% 0%, #0d2045 0%, #071020 50%, #05080f 100%);
}
.stars {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 32% 8%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 5%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 22%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 42% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 60% 42%, rgba(255,255,255,0.35) 0%, transparent 100%);
}
.horizon-glow {
  position: fixed; bottom: 0; left: 0; right: 0; height: 35vh; z-index: 0;
  background: linear-gradient(to top, rgba(30,60,100,0.3) 0%, transparent 100%);
}
.wrapper {
  position: relative; z-index: 1;
  max-width: 700px;
  margin: 0 auto;
  padding: 0 18px 80px;
}
header {
  text-align: center;
  padding: 44px 0 28px;
  opacity: 0;
  animation: fadeDown .7s ease forwards .1s;
}
.mosque-icon { font-size: 2.2rem; display: block; margin-bottom: 8px; }
header h1 {
  font-family: 'Amiri', serif;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  color: var(--gold-light);
  letter-spacing: 1px;
}
.location-row {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-top: 10px;
  font-size: 0.85rem; color: var(--text-dim);
}
.location-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); display:inline-block; }
.clock-block {
  text-align: center; margin-bottom: 28px;
  opacity: 0; animation: fadeDown .7s ease forwards .3s;
}
.clock-time {
  font-family: 'Amiri', serif;
  font-size: clamp(3rem, 10vw, 5rem);
  color: var(--text); line-height: 1; letter-spacing: 3px;
}
.clock-date { color: var(--text-dim); font-size: 0.82rem; margin-top: 4px; font-weight: 300; }
.next-prayer-banner {
  background: linear-gradient(135deg, rgba(212,168,67,0.14), rgba(212,168,67,0.06));
  border: 1px solid var(--gold-border); border-radius: 16px;
  padding: 18px 24px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  opacity: 0; animation: fadeUp .7s ease forwards .5s;
  position: relative; overflow: hidden;
}
.next-prayer-banner::before {
  content: ''; position: absolute; top:-50%; left:-20%;
  width:200px; height:200px;
  background: radial-gradient(circle, rgba(212,168,67,0.08), transparent 70%);
  pointer-events: none;
}
.next-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 2px; }
.next-name { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--gold-light); }
.next-time-box { text-align: left; }
.next-time { font-family: 'Amiri', serif; font-size: 1.6rem; color: var(--text); }
.next-countdown { font-size: 0.78rem; color: var(--gold); margin-top: 2px; text-align: left; }
.prayers-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 24px;
  opacity: 0; animation: fadeUp .7s ease forwards .7s;
}
@media (max-width: 400px) { .prayers-grid { grid-template-columns: 1fr; } }
.prayer-card {
  background: var(--surface); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between;
  transition: border-color .3s, background .3s;
  position: relative; overflow: hidden;
}
.prayer-card.is-next {
  background: var(--gold-dim); border-color: var(--gold-border);
  box-shadow: 0 0 30px rgba(212,168,67,0.08);
}
.prayer-card.is-next::after {
  content: ''; position: absolute; top:0; right:0;
  width: 3px; height: 100%; background: var(--gold); border-radius: 0 14px 14px 0;
}
.prayer-card.passed { opacity: 0.45; }
.prayer-ar {
  font-family: 'Amiri', serif; font-size: 1.15rem;
  color: var(--text); display: block;
}
.prayer-en { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.prayer-time { font-family: 'Amiri', serif; font-size: 1.3rem; color: var(--text-mid); direction: ltr; }
.prayer-card.is-next .prayer-time { color: var(--gold-light); }
.next-tag {
  position: absolute; top:8px; left:10px;
  font-size: 0.62rem; background: var(--gold); color: #1a1000;
  padding: 2px 7px; border-radius: 20px; font-weight: 600;
}
.section-divider {
  display: flex; align-items: center; gap: 14px;
  margin: 28px 0 20px;
  opacity: 0; animation: fadeUp .7s ease forwards .9s;
}
.section-divider::before, .section-divider::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to left, transparent, var(--gold-border), transparent);
}
.section-divider span { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; letter-spacing: 1px; }
.qibla-card {
  background: var(--surface); border: 1px solid var(--card-border);
  border-radius: 20px; padding: 30px 24px; text-align: center;
  opacity: 0; animation: fadeUp .7s ease forwards 1s;
}
.qibla-card h2 { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--gold-light); margin-bottom: 4px; }
.qibla-subtitle { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 26px; }
.compass-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 20px; }
.compass-ring {
  width: 220px; height: 220px; border-radius: 50%;
  border: 2px solid var(--gold-border); position: relative;
  background: radial-gradient(circle, rgba(212,168,67,0.04) 0%, transparent 70%);
}
.compass-ring::before {
  content: ''; position: absolute; inset: 10px; border-radius: 50%;
  border: 1px dashed rgba(212,168,67,0.12);
}
.cardinal {
  position: absolute; font-size: 0.72rem; color: var(--text-dim);
  font-weight: 600; letter-spacing: 1px; transform: translate(-50%, -50%);
}
.cardinal.N { top: 7%; left: 50%; color: var(--gold); }
.cardinal.S { top: 93%; left: 50%; }
.cardinal.E { top: 50%; left: 94%; }
.cardinal.W { top: 50%; left: 6%; }

/* SVG-based needle inside compass */
.needle-svg-wrap {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  transition: transform 1.2s cubic-bezier(0.34,1.56,0.64,1);
}
.needle-center-dot {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 14px var(--gold); z-index: 2;
}
.kaaba-pin {
  position: absolute; top: 50%; left: 50%;
  font-size: 1.1rem;
  filter: drop-shadow(0 0 6px var(--gold));
  z-index: 3;
  pointer-events: none;
  transform-origin: 0 0;
}
.qibla-degrees { font-family: 'Amiri', serif; font-size: 1.8rem; color: var(--gold-light); margin-bottom: 4px; }
.qibla-desc { font-size: 0.82rem; color: var(--text-dim); }
.status-msg {
  background: var(--surface); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 20px; text-align: center;
  color: var(--text-dim); font-size: 0.88rem;
}
.btn-locate {
  background: var(--gold-dim); border: 1px solid var(--gold-border);
  color: var(--gold-light); padding: 10px 24px; border-radius: 8px;
  cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 0.88rem;
  font-weight: 500; margin-top: 12px; transition: all .2s; display: inline-block;
}
.btn-locate:hover { background: rgba(212,168,67,0.2); }
@keyframes fadeDown { from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeUp   { from { opacity:0; transform:translateY(14px);  } to { opacity:1; transform:translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.loader { width:28px; height:28px; border:2px solid var(--gold-border); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 10px; }
</style>
</head>
<body>
<div class="sky-bg"></div>
<div class="stars"></div>
<div class="horizon-glow"></div>

<div class="wrapper">
  <header>
    <span class="mosque-icon">🕌</span>
    <h1>مواقيت الصلاة</h1>
    <div class="location-row">
      <span class="location-dot"></span>
      <span id="location-name">جارٍ تحديد الموقع…</span>
    </div>
  </header>

  <div class="clock-block">
    <div class="clock-time" id="clock">--:--:--</div>
    <div class="clock-date" id="clock-date">--</div>
  </div>

  <div id="next-banner" class="next-prayer-banner" style="display:none;">
    <div>
      <div class="next-label">الصلاة القادمة</div>
      <div class="next-name" id="next-name">--</div>
    </div>
    <div class="next-time-box">
      <div class="next-time" id="next-time">--:--</div>
      <div class="next-countdown" id="next-countdown">--</div>
    </div>
  </div>

  <div id="prayers-container">
    <div class="status-msg">
      <div class="loader"></div>
      <div>جارٍ تحديد موقعك وحساب مواقيت الصلاة…</div>
    </div>
  </div>

  <div class="section-divider"><span>✦ اتجاه القبلة ✦</span></div>

  <div class="qibla-card">
    <h2>القبلة</h2>
    <p class="qibla-subtitle" id="qibla-subtitle">سيظهر الاتجاه بعد تحديد الموقع</p>
    <div class="compass-wrap">
      <div class="compass-ring" id="compass-ring">
        <span class="cardinal N">ش</span>
        <span class="cardinal S">ج</span>
        <span class="cardinal E">ق</span>
        <span class="cardinal W">غ</span>
        <!-- SVG needle -->
        <svg id="needle-svg" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:transform 1.2s cubic-bezier(0.34,1.56,0.64,1);" viewBox="-110 -110 220 220">
          <!-- south tail -->
          <polygon points="0,-6 0,6 0,55" fill="rgba(120,90,30,0.4)" stroke="none"/>
          <polygon points="-3,0 3,0 0,52" fill="rgba(100,80,30,0.35)"/>
          <!-- north arrow -->
          <polygon points="-4,0 4,0 0,-80" fill="url(#ng)"/>
          <!-- kaaba emoji positioned at tip -->
          <text x="0" y="-88" text-anchor="middle" font-size="14" style="filter:drop-shadow(0 0 4px #d4a843)">🕋</text>
          <defs>
            <linearGradient id="ng" x1="0" y1="0" x2="0" y2="-80" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#d4a843" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#f0c96a"/>
            </linearGradient>
          </defs>
          <!-- center dot -->
          <circle cx="0" cy="0" r="5" fill="#d4a843" filter="url(#glow)"/>
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
        </svg>
      </div>
    </div>
    <div class="qibla-degrees" id="qibla-deg">-- °</div>
    <div class="qibla-desc" id="qibla-desc">في انتظار تحديد الموقع</div>
  </div>
</div>

<script>
const PRAYER_NAMES = [
  { ar:'الفجر',  en:'Fajr',    icon:'🌙', key:'fajr'    },
  { ar:'الشروق', en:'Sunrise', icon:'🌅', key:'sunrise' },
  { ar:'الظهر',  en:'Dhuhr',   icon:'☀️', key:'dhuhr'   },
  { ar:'العصر',  en:'Asr',     icon:'🌤', key:'asr'     },
  { ar:'المغرب', en:'Maghrib', icon:'🌇', key:'maghrib' },
  { ar:'العشاء', en:'Isha',    icon:'🌃', key:'isha'    },
];
const METHOD = { fajr:18, isha:17 };

function rad(d){return d*Math.PI/180;}
function deg(r){return r*180/Math.PI;}
function fixAngle(a){return a-360*Math.floor(a/360);}
function fixHour(a){return a-24*Math.floor(a/24);}

function sunPosition(jd){
  const D=jd-2451545.0;
  const g=fixAngle(357.529+0.98560028*D);
  const q=fixAngle(280.459+0.98564736*D);
  const L=fixAngle(q+1.915*Math.sin(rad(g))+0.020*Math.sin(rad(2*g)));
  const e=23.439-0.00000036*D;
  const RA=deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15;
  const eqt=q/15-fixHour(RA);
  const decl=deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L))));
  return {decl,eqt};
}

function julianDay(date){
  const Y=date.getFullYear(),M=date.getMonth()+1,D=date.getDate();
  const A=Math.floor((14-M)/12);
  const y=Y+4800-A, m=M+12*A-3;
  return D+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045-0.5;
}

function computeTimes(lat,lng,date,tz){
  const jd=julianDay(date);
  const {decl,eqt}=sunPosition(jd);
  const midday=fixHour(12-lng/15-eqt)+tz;
  function hourAngle(angle,ccw){
    const val=-Math.sin(rad(angle))-Math.sin(rad(lat))*Math.sin(rad(decl));
    const div=Math.cos(rad(lat))*Math.cos(rad(decl));
    const t=deg(Math.acos(val/div))/15;
    return ccw?midday-t:midday+t;
  }
  function asrHour(factor){
    const angle=deg(Math.atan(1/(factor+Math.tan(rad(Math.abs(lat-decl))))));
    return hourAngle(-angle,false);
  }
  return {
    fajr:hourAngle(-METHOD.fajr,true),
    sunrise:hourAngle(-0.833,true),
    dhuhr:midday,
    asr:asrHour(1),
    maghrib:hourAngle(-0.833,false),
    isha:hourAngle(-METHOD.isha,false),
  };
}

function fmtTime(h){
  const t=((h%24)+24)%24;
  let hr=Math.floor(t),min=Math.round((t-hr)*60);
  if(min===60){min=0;hr=(hr+1)%24;}
  const suffix=hr>=12?'م':'ص';
  const h12=hr%12||12;
  return `${String(h12).padStart(2,'0')}:${String(min).padStart(2,'0')} ${suffix}`;
}

function toDecimalHour(h){return((h%24)+24)%24;}

const KAABA={lat:21.4225,lng:39.8262};
function qiblaDirection(lat,lng){
  const dLng=rad(KAABA.lng-lng);
  const φ1=rad(lat),φ2=rad(KAABA.lat);
  const y=Math.sin(dLng)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(dLng);
  return(deg(Math.atan2(y,x))+360)%360;
}

function compassDescription(d){
  const dirs=['الشمال','الشمال الشرقي','الشرق','الجنوب الشرقي','الجنوب','الجنوب الغربي','الغرب','الشمال الغربي'];
  return dirs[Math.round(d/45)%8];
}

function fmtCountdown(ms){
  if(ms<0)return'';
  const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);
  if(h>0)return`بعد ${h}س ${m}د`;
  if(m>0)return`بعد ${m}د ${s}ث`;
  return`بعد ${s}ث`;
}

const AR_DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent=`${h}:${m}:${s}`;
  document.getElementById('clock-date').textContent=
    `${AR_DAYS[now.getDay()]} — ${now.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}`;
}

let cachedTimes=null;

function renderPrayers(times){
  cachedTimes=times;
  const now=new Date();
  const nowH=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  let nextIdx=-1,nextDiff=Infinity;
  PRAYER_NAMES.forEach((p,i)=>{
    if(p.key==='sunrise')return;
    const ph=toDecimalHour(times[p.key]);
    const diff=ph>nowH?ph-nowH:24-nowH+ph;
    if(diff<nextDiff){nextDiff=diff;nextIdx=i;}
  });
  const nb=document.getElementById('next-banner');
  if(nextIdx>=0){
    const np=PRAYER_NAMES[nextIdx];
    nb.style.display='flex';
    document.getElementById('next-name').textContent=np.ar;
    document.getElementById('next-time').textContent=fmtTime(times[np.key]);
    document.getElementById('next-countdown').textContent=fmtCountdown(nextDiff*3600000);
  }
  let html='<div class="prayers-grid">';
  PRAYER_NAMES.forEach((p,i)=>{
    const ph=toDecimalHour(times[p.key]);
    const passed=ph<nowH&&i!==nextIdx;
    const isNext=i===nextIdx;
    html+=`<div class="prayer-card ${isNext?'is-next':''} ${passed?'passed':''}">
      ${isNext?'<span class="next-tag">التالية</span>':''}
      <div>
        <span class="prayer-ar">${p.icon} ${p.ar}</span>
        <span class="prayer-en">${p.en}</span>
      </div>
      <div class="prayer-time">${fmtTime(times[p.key])}</div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('prayers-container').innerHTML=html;
}

function updateCountdown(){
  if(!cachedTimes)return;
  const now=new Date();
  const nowH=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  let nextIdx=-1,nextDiff=Infinity;
  PRAYER_NAMES.forEach((p,i)=>{
    if(p.key==='sunrise')return;
    const ph=toDecimalHour(cachedTimes[p.key]);
    const diff=ph>nowH?ph-nowH:24-nowH+ph;
    if(diff<nextDiff){nextDiff=diff;nextIdx=i;}
  });
  if(nextIdx>=0){
    const np=PRAYER_NAMES[nextIdx];
    document.getElementById('next-name').textContent=np.ar;
    document.getElementById('next-time').textContent=fmtTime(cachedTimes[np.key]);
    document.getElementById('next-countdown').textContent=fmtCountdown(nextDiff*3600000);
  }
  renderPrayers(cachedTimes);
}

function renderQibla(lat,lng){
  const q=qiblaDirection(lat,lng);
  document.getElementById('qibla-deg').textContent=`${Math.round(q)}°`;
  document.getElementById('qibla-desc').textContent=`باتجاه ${compassDescription(q)} من موقعك`;
  document.getElementById('qibla-subtitle').textContent='وجّه السهم نحو الكعبة المشرّفة';
  document.getElementById('needle-svg').style.transform=`rotate(${q}deg)`;
}

function onLocation(pos){
  const lat=pos.coords.latitude,lng=pos.coords.longitude;
  const tz=-new Date().getTimezoneOffset()/60;
  fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ar`)
    .then(r=>r.json())
    .then(d=>{
      const city=d.address.city||d.address.town||d.address.village||d.address.county||'موقعك';
      const country=d.address.country||'';
      document.getElementById('location-name').textContent=`${city}، ${country}`;
    })
    .catch(()=>{
      document.getElementById('location-name').textContent=`${lat.toFixed(2)}°, ${lng.toFixed(2)}°`;
    });
  const times=computeTimes(lat,lng,new Date(),tz);
  renderPrayers(times);
  renderQibla(lat,lng);
}

function onLocationError(){
  document.getElementById('location-name').textContent='تعذّر تحديد الموقع';
  document.getElementById('prayers-container').innerHTML=`
    <div class="status-msg">
      <div style="font-size:1.5rem;margin-bottom:8px">📍</div>
      <div>يحتاج الموقع إلى إذن الوصول للموقع الجغرافي</div>
      <button class="btn-locate" onclick="requestLocation()">السماح بالوصول</button>
    </div>`;
}

function requestLocation(){
  navigator.geolocation.getCurrentPosition(onLocation,onLocationError,{enableHighAccuracy:true,timeout:10000});
}

updateClock();
setInterval(updateClock,1000);
setInterval(updateCountdown,30000);

if(navigator.geolocation){requestLocation();}
else{document.getElementById('prayers-container').innerHTML='<div class="status-msg">متصفحك لا يدعم تحديد الموقع الجغرافي</div>';}
</script>
