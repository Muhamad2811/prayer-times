<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>حصني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #d4a843;
  --gold-light: #f0c96a;
  --gold-dim: rgba(212,168,67,0.12);
  --gold-border: rgba(212,168,67,0.25);
  --text: #e8e0d0;
  --text-dim: #7a7060;
  --text-mid: #b0a898;
  --surface: rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.07);
  --card-border: rgba(255,255,255,0.08);
  --green: #3d7a5e;
  --green-light: #5aaf88;
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height:100%; overflow:hidden; }
body {
  background: #05080f;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  display: flex;
  flex-direction: column;
}

/* ── Background ── */
.bg-layer {
  position: fixed; inset:0; z-index:0; pointer-events:none;
  background: radial-gradient(ellipse 100% 60% at 50% 0%, #0d2045 0%, #071020 50%, #05080f 100%);
}
.bg-stars {
  position: fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1px 1px at 32%  8%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px 1px at 70%  5%, rgba(255,255,255,0.4)  0%, transparent 100%),
    radial-gradient(1px 1px at 85% 22%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px 1px at 42% 30%, rgba(255,255,255,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 40%, rgba(255,255,255,0.3)  0%, transparent 100%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 20% 50%, rgba(255,255,255,0.3) 0%, transparent 100%);
}

/* ── Top Nav ── */
.top-nav {
  position: relative; z-index:10;
  display: flex;
  background: rgba(5,8,15,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--card-border);
  padding-top: env(safe-area-inset-top, 0px);
}
.top-nav-btn {
  flex: 1; padding: 16px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: none; cursor: pointer;
  color: var(--text-dim); font-family: 'Cairo', sans-serif;
  font-size: 0.72rem; font-weight: 500;
  transition: color .25s;
  position: relative;
}
.top-nav-btn .nav-icon { font-size: 1.3rem; line-height:1; }
.top-nav-btn.active { color: var(--gold-light); }
.top-nav-btn.active::after {
  content:''; position:absolute; bottom:0; left:20%; right:20%;
  height: 2px; background: var(--gold); border-radius: 2px 2px 0 0;
}

/* ── Page container ── */
.pages {
  flex: 1; overflow: hidden; position: relative; z-index:1;
}
.page {
  position: absolute; inset:0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  opacity:0; pointer-events:none;
  transition: opacity .25s;
  padding-bottom: calc(20px + var(--safe-bottom));
}
.page.active { opacity:1; pointer-events:all; }

/* ── Inner content wrapper ── */
.inner {
  max-width: 620px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ═══════════════════════════════════════
   PRAYER TIMES PAGE
═══════════════════════════════════════ */
.prayer-header {
  text-align: center;
  padding: 28px 0 20px;
}
.mosque-icon { font-size:2rem; display:block; margin-bottom:6px; }
.prayer-header h1 {
  font-family:'Amiri',serif;
  font-size: clamp(1.6rem,5vw,2.2rem);
  color: var(--gold-light); letter-spacing:1px;
}
.location-row {
  display:flex; align-items:center; justify-content:center;
  gap:6px; margin-top:8px; font-size:0.82rem; color:var(--text-dim);
}
.loc-dot { width:5px;height:5px;border-radius:50%;background:var(--gold);display:inline-block; }

.clock-block { text-align:center; margin-bottom:22px; }
.clock-time {
  font-family:'Amiri',serif;
  font-size: clamp(2.8rem,11vw,4.5rem);
  color:var(--text); line-height:1; letter-spacing:2px;
}
.clock-date { color:var(--text-dim); font-size:0.8rem; margin-top:4px; font-weight:300; }

.next-banner {
  background: linear-gradient(135deg,rgba(212,168,67,.14),rgba(212,168,67,.05));
  border:1px solid var(--gold-border); border-radius:14px;
  padding:16px 20px; margin-bottom:18px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.next-label { font-size:0.72rem; color:var(--text-dim); margin-bottom:1px; }
.next-name  { font-family:'Amiri',serif; font-size:1.4rem; color:var(--gold-light); }
.next-time  { font-family:'Amiri',serif; font-size:1.5rem; color:var(--text); }
.next-cd    { font-size:0.75rem; color:var(--gold); margin-top:2px; text-align:left; }

.prayers-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:20px; }
@media(max-width:360px){ .prayers-grid{grid-template-columns:1fr;} }
.p-card {
  background:var(--surface); border:1px solid var(--card-border);
  border-radius:12px; padding:15px 16px;
  display:flex; align-items:center; justify-content:space-between;
  position:relative; overflow:hidden; transition:opacity .3s;
}
.p-card.is-next { background:var(--gold-dim); border-color:var(--gold-border); }
.p-card.is-next::after {
  content:''; position:absolute; top:0;right:0;
  width:3px;height:100%;background:var(--gold);border-radius:0 12px 12px 0;
}
.p-card.passed { opacity:.38; }
.p-ar { font-family:'Amiri',serif; font-size:1.1rem; color:var(--text); display:block; }
.p-en { font-size:0.65rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.8px; }
.p-time { font-family:'Amiri',serif; font-size:1.2rem; color:var(--text-mid); direction:ltr; }
.p-card.is-next .p-time { color:var(--gold-light); }
.next-tag {
  position:absolute;top:7px;left:8px;
  font-size:.58rem;background:var(--gold);color:#1a1000;
  padding:2px 6px;border-radius:20px;font-weight:600;
}

.status-msg {
  background:var(--surface); border:1px solid var(--card-border);
  border-radius:12px; padding:28px 20px; text-align:center;
  color:var(--text-dim); font-size:.88rem; margin-bottom:16px;
}
.btn-allow {
  background:var(--gold-dim); border:1px solid var(--gold-border);
  color:var(--gold-light); padding:10px 22px; border-radius:8px;
  cursor:pointer; font-family:'Cairo',sans-serif; font-size:.86rem;
  font-weight:500; margin-top:12px; display:inline-block; transition:all .2s;
}
.btn-allow:hover { background:rgba(212,168,67,.22); }

/* ═══════════════════════════════════════
   ADHKAR PAGE — sub-nav
═══════════════════════════════════════ */
.adhkar-subnav {
  display:flex; gap:6px; padding:14px 0 10px;
  overflow-x:auto; scrollbar-width:none;
}
.adhkar-subnav::-webkit-scrollbar { display:none; }
.sub-btn {
  flex-shrink:0;
  background:var(--surface); border:1px solid var(--card-border);
  color:var(--text-dim); padding:8px 16px; border-radius:30px;
  cursor:pointer; font-family:'Cairo',sans-serif; font-size:.8rem;
  font-weight:500; transition:all .25s; white-space:nowrap;
  display:flex; align-items:center; gap:5px;
}
.sub-btn.active {
  background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold-light);
}

.adhkar-section { display:none; }
.adhkar-section.active { display:block; }

.section-intro {
  text-align:center; margin-bottom:16px;
  padding:16px; background:var(--gold-dim);
  border:1px solid var(--gold-border); border-radius:12px;
}
.section-intro h2 { font-family:'Amiri',serif; font-size:1.3rem; color:var(--gold-light); margin-bottom:2px; }
.section-intro p { color:var(--text-dim); font-size:.78rem; }

.dhikr-card {
  background:var(--surface); border:1px solid var(--card-border);
  border-radius:14px; padding:20px; margin-bottom:10px;
  position:relative; overflow:hidden; transition:opacity .3s, border-color .3s;
}
.dhikr-card::before {
  content:''; position:absolute; top:0;right:0;
  width:3px;height:100%;background:var(--card-border);
  border-radius:0 14px 14px 0; transition:background .3s;
}
.dhikr-card.done { opacity:.55; }
.dhikr-card.done::before { background:var(--green); }

.d-num { position:absolute;top:12px;left:14px;font-size:.7rem;color:var(--text-dim); }
.d-text {
  font-family:'Amiri',serif;
  font-size:clamp(1.1rem,3.2vw,1.35rem);
  line-height:2; color:var(--text); text-align:center; margin-bottom:14px;
}
.dhikr-card.done .d-text { color:var(--text-dim); }
.d-footer {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
}
.d-source { font-size:.72rem; color:var(--text-dim); font-style:italic; }
.d-controls { display:flex; align-items:center; gap:8px; }
.d-badge {
  background:var(--gold-dim); border:1px solid var(--gold-border);
  color:var(--gold); padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:500;
}
.d-cnt { font-size:.78rem; color:var(--text-mid); min-width:38px; text-align:center; }
.d-btn {
  background:var(--surface2); border:1px solid var(--card-border);
  color:var(--text); padding:7px 16px; border-radius:8px;
  cursor:pointer; font-family:'Cairo',sans-serif; font-size:.82rem;
  font-weight:500; transition:all .2s; user-select:none;
}
.d-btn:active { transform:scale(.95); background:var(--gold-dim); border-color:var(--gold-border); color:var(--gold-light); }
.d-done-icon { color:var(--green-light); font-size:1.2rem; }

.adhkar-progress {
  background:var(--surface); border:1px solid var(--card-border);
  border-radius:10px; padding:10px 16px;
  display:flex; align-items:center; gap:10px;
  margin-bottom:14px; font-size:.78rem; color:var(--text-dim);
}
.prog-track { flex:1; height:3px; background:rgba(255,255,255,.06); border-radius:2px; overflow:hidden; }
.prog-fill  { height:100%; background:linear-gradient(90deg,var(--green),var(--gold)); border-radius:2px; transition:width .4s; }
.prog-pct   { color:var(--gold); font-weight:500; white-space:nowrap; }

.reset-btn {
  display:block; margin:16px auto 0;
  background:transparent; border:1px solid var(--card-border);
  color:var(--text-dim); padding:8px 20px; border-radius:8px;
  cursor:pointer; font-family:'Cairo',sans-serif; font-size:.78rem;
  transition:all .3s;
}
.reset-btn:hover { border-color:var(--gold); color:var(--gold); }

/* ── Loaders ── */
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.loader { width:26px;height:26px;border:2px solid var(--gold-border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px; }
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="bg-stars"></div>

<!-- ══ TOP NAV ══ -->
<nav class="top-nav">
  <button class="top-nav-btn active" id="nav-prayer" onclick="showPage('prayer')">
    <span class="nav-icon">🕌</span>
    مواقيت الصلاة
  </button>
  <button class="top-nav-btn" id="nav-adhkar" onclick="showPage('adhkar')">
    <span class="nav-icon">📿</span>
    الأذكار
  </button>
</nav>

<!-- ══ PAGES ══ -->
<div class="pages">

  <!-- ── Prayer Times ── -->
  <div class="page active" id="page-prayer">
    <div class="inner">
      <div class="prayer-header">
        <span class="mosque-icon">🕌</span>
        <h1>مواقيت الصلاة</h1>
        <div class="location-row">
          <span class="loc-dot"></span>
          <span id="loc-name">جارٍ تحديد الموقع…</span>
        </div>
      </div>

      <div class="clock-block">
        <div class="clock-time" id="clock">--:--:--</div>
        <div class="clock-date"  id="clock-date">--</div>
      </div>

      <div class="next-banner" id="next-banner" style="display:none">
        <div>
          <div class="next-label">الصلاة القادمة</div>
          <div class="next-name" id="next-name">--</div>
        </div>
        <div style="text-align:left">
          <div class="next-time" id="next-time">--:--</div>
          <div class="next-cd"   id="next-cd">--</div>
        </div>
      </div>

      <div id="prayers-wrap">
        <div class="status-msg">
          <div class="loader"></div>
          جارٍ تحديد موقعك وجلب مواقيت الصلاة…
        </div>
      </div>
    </div>
  </div>

  <!-- ── Adhkar ── -->
  <div class="page" id="page-adhkar">
    <div class="inner">
      <div style="display:flex;align-items:center;gap:8px;padding:20px 0 4px;">
        <span style="font-size:1.6rem">📿</span>
        <span style="font-family:'Amiri',serif;font-size:1.5rem;color:var(--gold-light)">الأذكار</span>
      </div>
      <div class="adhkar-subnav" id="adhkar-subnav"></div>
      <div id="adhkar-body"></div>
    </div>
  </div>

</div><!-- /pages -->

<script>
/* ══════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════ */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.top-nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
}

/* ══════════════════════════════════════════════════════════
   PRAYER TIMES
══════════════════════════════════════════════════════════ */
const PRAYERS = [
  { ar:'الفجر',  en:'Fajr',    icon:'🌙', key:'Fajr'    },
  { ar:'الشروق', en:'Sunrise', icon:'🌅', key:'Sunrise' },
  { ar:'الظهر',  en:'Dhuhr',   icon:'☀️', key:'Dhuhr'   },
  { ar:'العصر',  en:'Asr',     icon:'🌤', key:'Asr'     },
  { ar:'المغرب', en:'Maghrib', icon:'🌇', key:'Maghrib' },
  { ar:'العشاء', en:'Isha',    icon:'🌃', key:'Isha'    },
];

function parseT(str) {
  const clean = str.replace(/\s*\(.*\)/, '').trim();
  const [h, m] = clean.split(':');
  return parseInt(h) + parseInt(m) / 60;
}
function fmt12(str) {
  let h = parseT(str);
  h = ((h % 24) + 24) % 24;
  let hr = Math.floor(h), min = Math.round((h - hr) * 60);
  if (min === 60) { min = 0; hr = (hr + 1) % 24; }
  const suf = hr >= 12 ? 'م' : 'ص';
  return `${String(hr % 12 || 12).padStart(2,'0')}:${String(min).padStart(2,'0')} ${suf}`;
}
function fmtCd(ms) {
  if (ms < 0) return '';
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000),
        s = Math.floor((ms % 60000) / 1000);
  if (h > 0) return `بعد ${h}س ${m}د`;
  if (m > 0) return `بعد ${m}د ${s}ث`;
  return `بعد ${s}ث`;
}

let cachedTimings = null;
let hijriFromApi  = null;

function updateClock() {
  const now = new Date();
  let h = now.getHours(), m = String(now.getMinutes()).padStart(2,'0'),
      s = String(now.getSeconds()).padStart(2,'0');
  const suf = h >= 12 ? 'م' : 'ص';
  document.getElementById('clock').textContent =
    `${String(h % 12 || 12).padStart(2,'0')}:${m}:${s} ${suf}`;

  // Date: prefer Hijri from API; fallback to browser Islamic
  if (hijriFromApi) {
    document.getElementById('clock-date').textContent = hijriFromApi;
  } else {
    const AR_DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    try {
      const hStr = now.toLocaleDateString('ar-SA-u-ca-islamic-umalqura',
        { year:'numeric', month:'long', day:'numeric' });
      document.getElementById('clock-date').textContent = AR_DAYS[now.getDay()] + '، ' + hStr;
    } catch(e) {
      document.getElementById('clock-date').textContent = '';
    }
  }
}

function renderPrayers(timings) {
  cachedTimings = timings;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  function toMin(k) { return Math.round(parseT(timings[k]) * 60); }

  let nextIdx = -1, nextDiff = Infinity;
  PRAYERS.forEach((p, i) => {
    if (p.key === 'Sunrise') return;
    const pm = toMin(p.key);
    const diff = pm >= nowMin ? pm - nowMin : 1440 - nowMin + pm;
    if (diff < nextDiff) { nextDiff = diff; nextIdx = i; }
  });

  const nb = document.getElementById('next-banner');
  if (nextIdx >= 0) {
    nb.style.display = 'flex';
    document.getElementById('next-name').textContent = PRAYERS[nextIdx].ar;
    document.getElementById('next-time').textContent = fmt12(timings[PRAYERS[nextIdx].key]);
    document.getElementById('next-cd').textContent   = fmtCd(nextDiff * 60000);
  }

  let html = '<div class="prayers-grid">';
  PRAYERS.forEach((p, i) => {
    const pm = toMin(p.key);
    const passed = pm < nowMin && i !== nextIdx;
    const isNext = i === nextIdx;
    html += `<div class="p-card ${isNext?'is-next':''} ${passed?'passed':''}">
      ${isNext ? '<span class="next-tag">التالية</span>' : ''}
      <div>
        <span class="p-ar">${p.icon} ${p.ar}</span>
        <span class="p-en">${p.en}</span>
      </div>
      <div class="p-time">${fmt12(timings[p.key])}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('prayers-wrap').innerHTML = html;
}

function tick() {
  if (cachedTimings) renderPrayers(cachedTimings);
}

function onLocation(pos) {
  const lat = pos.coords.latitude, lng = pos.coords.longitude;

  // Reverse geocode
  fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ar&zoom=14`)
    .then(r => r.json()).then(d => {
      const a = d.address;
      const place = a.quarter||a.suburb||a.neighbourhood||a.village||a.town||a.city||a.county||'موقعك';
      document.getElementById('loc-name').textContent = (a.country ? place+'، '+a.country : place);
    }).catch(() => { document.getElementById('loc-name').textContent = `${lat.toFixed(3)}°، ${lng.toFixed(3)}°`; });

  // Prayer times — method 5 = Egyptian General Authority of Survey
  const t = new Date();
  const dd = String(t.getDate()).padStart(2,'0');
  const mm = String(t.getMonth()+1).padStart(2,'0');
  const url = `https://api.aladhan.com/v1/timings/${dd}-${mm}-${t.getFullYear()}?latitude=${lat}&longitude=${lng}&method=5&calendarMethod=HJCoSA`;

  document.getElementById('prayers-wrap').innerHTML =
    '<div class="status-msg"><div class="loader"></div>جارٍ جلب المواقيت…</div>';

  fetch(url).then(r => r.json()).then(data => {
    if (data.code !== 200) throw new Error();
    // Build Hijri string from API — most accurate
    const h = data.data.date.hijri;
    const AR_DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    hijriFromApi = `${AR_DAYS[new Date().getDay()]}، ${h.day} ${h.month.ar} ${h.year} هـ`;
    document.getElementById('clock-date').textContent = hijriFromApi;
    renderPrayers(data.data.timings);
  }).catch(() => {
    document.getElementById('prayers-wrap').innerHTML =
      `<div class="status-msg"><div style="font-size:1.4rem;margin-bottom:8px">⚠️</div>
       تعذّر جلب المواقيت<br>
       <button class="btn-allow" onclick="requestLocation()">إعادة المحاولة</button></div>`;
  });
}

function onLocError() {
  document.getElementById('loc-name').textContent = 'تعذّر تحديد الموقع';
  document.getElementById('prayers-wrap').innerHTML =
    `<div class="status-msg"><div style="font-size:1.5rem;margin-bottom:8px">📍</div>
     يحتاج التطبيق إذن الوصول للموقع الجغرافي<br>
     <button class="btn-allow" onclick="requestLocation()">السماح بالوصول</button></div>`;
}

function requestLocation() {
  navigator.geolocation.getCurrentPosition(onLocation, onLocError,
    { enableHighAccuracy:true, timeout:12000 });
}

/* ══════════════════════════════════════════════════════════
   ADHKAR DATA  (حصن المسلم)
══════════════════════════════════════════════════════════ */
const ADHKAR_CATS = [
  {
    id:'morning', icon:'🌅', label:'الصباح',

let adhkarState = {};   // { catId: [count, count, ...] }
let activeCat   = 'morning';

function initAdhkar() {
  ADHKAR_CATS.forEach(cat => {
    adhkarState[cat.id] = cat.items.map(() => 0);
  });

  // Build sub-nav
  const nav = document.getElementById('adhkar-subnav');
  nav.innerHTML = ADHKAR_CATS.map(cat =>
    `<button class="sub-btn ${cat.id===activeCat?'active':''}" id="subbtn-${cat.id}" onclick="switchCat('${cat.id}')">
      <span>${cat.icon}</span>${cat.label}
    </button>`
  ).join('');

  renderAdhkar();
}

function switchCat(id) {
  activeCat = id;
  document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('subbtn-' + id).classList.add('active');
  renderAdhkar();
  // Scroll to top of adhkar page
  document.getElementById('page-adhkar').scrollTop = 0;
}

function renderAdhkar() {
  const cat    = ADHKAR_CATS.find(c => c.id === activeCat);
  const counts = adhkarState[activeCat];
  const total  = cat.items.reduce((s,it) => s + it.repeat, 0);
  const done   = counts.reduce((s,c,i) => s + Math.min(c, cat.items[i].repeat), 0);
  const pct    = total ? Math.round(done / total * 100) : 0;

  let html = `
    <div class="section-intro">
      <h2>${cat.icon} ${cat.title}</h2>
      <p>${cat.sub}</p>
    </div>
    <div class="adhkar-progress">
      <span>${done} / ${total}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="prog-pct">${pct}٪</span>
    </div>`;

  cat.items.forEach((item, i) => {
    const cnt    = counts[i];
    const isDone = cnt >= item.repeat;
    html += `
      <div class="dhikr-card ${isDone?'done':''}" id="dcard-${activeCat}-${i}">
        <span class="d-num">${i+1}</span>
        <div class="d-text">${item.text.replace(/\n/g,'<br>')}</div>
        <div class="d-footer">
          <span class="d-source">📖 ${item.source}</span>
          <div class="d-controls">
            <span class="d-badge">${item.repeat}×</span>
            ${isDone
              ? `<span class="d-done-icon">✓</span>`
              : `<span class="d-cnt" id="dcnt-${activeCat}-${i}">${cnt}/${item.repeat}</span>
                 <button class="d-btn" onclick="tapDhikr('${activeCat}',${i})">تسبيح</button>`
            }
          </div>
        </div>
      </div>`;
  });

  if (pct === 100) {
    html += `<div style="text-align:center;padding:24px;background:rgba(61,122,94,.1);border:1px solid rgba(61,122,94,.3);border-radius:14px;margin-top:8px;">
      <div style="font-family:'Amiri',serif;font-size:1.5rem;color:#5aaf88;margin-bottom:6px">🌿 أحسنت</div>
      <div style="font-size:.82rem;color:var(--text-dim)">أتممت ${cat.title} — جزاك الله خيرًا</div>
    </div>`;
  }

  html += `<button class="reset-btn" onclick="resetCat('${activeCat}')">↺ إعادة التهيئة</button>`;

  document.getElementById('adhkar-body').innerHTML = html;
}

function tapDhikr(catId, idx) {
  const item = ADHKAR_CATS.find(c => c.id === catId).items[idx];
  if (adhkarState[catId][idx] < item.repeat) {
    adhkarState[catId][idx]++;
    if (adhkarState[catId][idx] >= item.repeat) {
      renderAdhkar();  // full re-render when card completes
    } else {
      // Fast path: just update counter text
      const el = document.getElementById(`dcnt-${catId}-${idx}`);
      if (el) el.textContent = `${adhkarState[catId][idx]}/${item.repeat}`;
      // Update progress bar
      const cat = ADHKAR_CATS.find(c => c.id === catId);
      const counts = adhkarState[catId];
      const total = cat.items.reduce((s,it) => s+it.repeat, 0);
      const done  = counts.reduce((s,c,i) => s+Math.min(c,cat.items[i].repeat), 0);
      const pct   = total ? Math.round(done/total*100) : 0;
      const fill  = document.querySelector('.prog-fill');
      const pctEl = document.querySelector('.prog-pct');
      const cntEl = document.querySelector('.adhkar-progress span');
      if (fill)  fill.style.width = pct + '%';
      if (pctEl) pctEl.textContent = pct + '٪';
      if (cntEl) cntEl.textContent = `${done} / ${total}`;
    }
  }
}

function resetCat(catId) {
  const cat = ADHKAR_CATS.find(c => c.id === catId);
  adhkarState[catId] = cat.items.map(() => 0);
  renderAdhkar();
}

else document.getElementById('prayers-wrap').innerHTML =
  '<div class="status-msg">متصفحك لا يدعم تحديد الموقع الجغرافي</div>';
</script>
